# Generated by scripts/render-manifests.sh — do not edit.
#
# the identities the agent and operator run as.
#
# Rendered from the pinned chart (cilium 1.20.2) with values.yaml, so this
# file can be reproduced and a version bump is a re-render rather than a
# hand-edit. The pin — chart and images together — is pinned.txt.
#
# Files are numbered because the applier goes in filename order and infers no
# dependencies. Every object carries `addonmanager.kubernetes.io/mode:
# Reconcile`, so a pallet carrying a newer Cilium replaces what is running
# instead of being created once and never touched again.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cilium
  namespace: kube-system
  annotations:
    addonmanager.kubernetes.io/mode: Reconcile
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cilium-operator
  namespace: kube-system
  annotations:
    addonmanager.kubernetes.io/mode: Reconcile
