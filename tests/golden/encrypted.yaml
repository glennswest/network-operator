apiVersion: v1
kind: ConfigMap
metadata:
  labels:
    app.kubernetes.io/managed-by: network-operator
    app.kubernetes.io/part-of: cilium
    network.storm.io/owner: cluster
  name: cilium-config
  namespace: kube-system
data:
  agent-health-port: '9879'
  bpf-lb-external-clusterip: 'false'
  bpf-map-dynamic-size-ratio: '0.0025'
  cluster-id: '0'
  cluster-name: default
  cluster-pool-ipv4-cidr: 10.244.0.0/16
  cluster-pool-ipv4-mask-size: '24'
  cni-exclusive: 'true'
  cni-log-file: /var/run/cilium/cilium-cni.log
  custom-cni-conf: 'false'
  debug: 'false'
  enable-bgp-control-plane: 'false'
  enable-bpf-masquerade: 'true'
  enable-endpoint-health-checking: 'true'
  enable-health-check-nodeport: 'true'
  enable-health-checking: 'true'
  enable-host-legacy-routing: 'false'
  enable-hubble: 'true'
  enable-ipsec: 'false'
  enable-ipv4: 'true'
  enable-ipv4-masquerade: 'true'
  enable-ipv6: 'false'
  enable-ipv6-masquerade: 'false'
  enable-k8s-networkpolicy: 'true'
  enable-l2-announcements: 'false'
  enable-l7-proxy: 'true'
  enable-lb-ipam: 'false'
  enable-metrics: 'true'
  enable-policy: default
  enable-policy-secrets-sync: 'true'
  enable-session-affinity: 'true'
  enable-wireguard: 'true'
  envoy-access-log-buffer-size: '4096'
  envoy-base-id: '0'
  envoy-keep-cap-netbindservice: 'false'
  external-envoy-proxy: 'false'
  hubble-disable-tls: 'true'
  hubble-listen-address: :4244
  hubble-metrics: drop dns tcp flow
  hubble-metrics-server: :9965
  hubble-metrics-server-enable-tls: 'false'
  hubble-network-policy-correlation-enabled: 'true'
  hubble-socket-path: /var/run/cilium/hubble.sock
  identity-allocation-mode: crd
  ipam: cluster-pool
  k8s-service-host: 192.168.8.98
  k8s-service-port: '6443'
  kube-proxy-replacement: 'true'
  monitor-aggregation: medium
  monitor-aggregation-flags: all
  monitor-aggregation-interval: 5s
  operator-api-serve-addr: 127.0.0.1:9234
  operator-prometheus-serve-addr: :9963
  policy-secrets-namespace: cilium-secrets
  policy-secrets-only-from-secrets-namespace: 'true'
  preallocate-bpf-maps: 'false'
  prometheus-serve-addr: :9962
  proxy-prometheus-port: '9964'
  routing-mode: tunnel
  tunnel-port: '8472'
  tunnel-protocol: vxlan
  write-cni-conf-when-ready: /host/etc/cni/net.d/05-cilium.conflist
---
apiVersion: v1
kind: Service
metadata:
  annotations:
    prometheus.io/port: '9964'
    prometheus.io/scrape: 'true'
  labels:
    app.kubernetes.io/managed-by: network-operator
    app.kubernetes.io/part-of: cilium
    k8s-app: cilium
    network.storm.io/owner: cluster
  name: cilium-agent
  namespace: kube-system
spec:
  clusterIP: None
  ports:
  - name: envoy-metrics
    port: 9964
    protocol: TCP
    targetPort: envoy-metrics
  selector:
    k8s-app: cilium
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  annotations:
    prometheus.io/port: '9965'
    prometheus.io/scrape: 'true'
  labels:
