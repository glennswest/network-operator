apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    network.storm.io/operator-version: 0.3.0
  name: vlans.network.storm.io
spec:
  group: network.storm.io
  names:
    categories: []
    kind: VLAN
    plural: vlans
    shortNames:
    - vl
    singular: vlan
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.id
      name: ID
      type: integer
    - jsonPath: .spec.bridge
      name: Bridge
      type: string
    - jsonPath: .status.nodeCount
      name: Nodes
      type: integer
    - jsonPath: .status.podCount
      name: Pods
      type: integer
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    name: v1
    schema:
      openAPIV3Schema:
        description: Auto-generated derived type for VlanSpec via `CustomResource`
        properties:
          spec:
            properties:
              addresses:
                description: 'Where a pod''s address on the VLAN comes from. Default: none (L2 only).'
                nullable: true
                properties:
                  routes:
                    description: '`static` only: routes added with the pod''s address.'
                    items:
                      properties:
                        dst:
                          description: Destination CIDR.
                          type: string
                        gw:
                          description: Next hop; unset routes out of the interface.
                          nullable: true
                          type: string
                      required:
                      - dst
                      type: object
                    type: array
                  type:
                    default: none
                    enum:
                    - none
                    - dhcp
                    - static
                    type: string
                type: object
              bridge:
                description: The node's VLAN-aware bridge (default `stormbr0`). The node agent only acts on the bridge it was started for; it turns `vlan_filtering` on and adds this VLAN to the bridge's uplink ports.
                nullable: true
                type: string
              defaultFor:
                default: []
                description: Namespaces whose default VLAN this is (allowed implicitly). A pod there that names no networks gets this one; one default per namespace.
                items:
                  type: string
                type: array
              id:
                description: The 802.1Q VLAN ID, 1–4094.
                format: uint16
                maximum: 4094.0
                minimum: 1.0
                type: integer
              mtu:
                description: 'MTU of the pods'' interfaces on this VLAN. Unset: the bridge''s.'
                format: uint32
                minimum: 0.0
                nullable: true
                type: integer
              namespaces:
                default: []
                description: Namespaces allowed to use the VLAN. Its NAD exists only there; a pod anywhere else naming it waits (no NAD), it never falls back.
                items:
                  type: string
                type: array
              uplink:
                description: 'The bridge port that carries the VLAN off the node (a NIC or a bond). Unset: every bridge port that is a NIC or a bond.'
                nullable: true
                type: string
            required:
            - id
            type: object
          status:
            description: Written only by the operator.
            nullable: true
            properties:
              conditions:
                items:
                  description: Condition contains details for one aspect of the current state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: lastTransitionTime is the last time the condition transitioned from one status to another. This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: message is a human readable message indicating details about the transition. This may be an empty string.
                      type: string
                    observedGeneration:
                      description: observedGeneration represents the .metadata.generation that the condition was set based upon. For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date with respect to the current state of the instance.
                      format: int64
                      type: integer
                    reason:
                      description: reason contains a programmatic identifier indicating the reason for the condition's last transition. Producers of specific condition types may define expected values and meanings for this field, and whether the values are considered a guaranteed API. The value should be a CamelCase string. This field may not be empty.
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              missingNamespaces:
                description: Allowed namespaces that do not exist (yet); their NAD follows them.
                items:
                  type: string
                type: array
              nads:
                description: '`namespace/name` of each NAD the operator keeps for this VLAN.'
                items:
                  type: string
                type: array
              nodeCount:
                default: 0
                format: int64
                type: integer
              nodes:
                description: Nodes whose agent reports this VLAN on the bridge's uplinks.
                items:
                  type: string
                type: array
              observedGeneration:
                format: int64
                nullable: true
                type: integer
              pendingNodes:
                description: Nodes with an agent that does not (yet) have it, with the reason.
                items:
                  type: string
                type: array
              podCount:
                default: 0
                format: int64
                type: integer
              pods:
                description: '`namespace/name` of pods attached to the VLAN (at most [`crate::vlan::MAX_LISTED_PODS`]; `podCount` is the full count).'
                items:
                  type: string
                type: array
            type: object
        required:
        - spec
        title: VLAN
        type: object
    served: true
    storage: true
    subresources:
      status: {}
