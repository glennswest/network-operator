# The VLAN layer alone (#32): the VLAN controller and its node agent. Apply
# after deploy/crds/network.storm.io_vlans.yaml (the controller also
# registers it itself).
#
# This is the only part of network-operator that may run on stormcos: the
# controller runs `--controllers vlan`, so the Cilium controller never starts,
# the Network CRD is never registered, and nothing in kube-system's Cilium
# objects is touched (#30). It needs a Multus-capable kubelet (rustkube-node
# runs NetworkAttachmentDefinitions) and the CNI `bridge` plugin (plus
# `static`/`dhcp` for addresses) in the node's CNI bin directory.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: network-operator-vlan
  namespace: kube-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: network-operator-vlan
rules:
# Self-registration of the VLAN CRD (src/register.rs).
- apiGroups: ["apiextensions.k8s.io"]
  resources: ["customresourcedefinitions"]
  verbs: ["get", "create", "update"]
- apiGroups: ["network.storm.io"]
  resources: ["vlans"]
  verbs: ["get", "list", "watch", "update"]
- apiGroups: ["network.storm.io"]
  resources: ["vlans/status"]
  verbs: ["get", "patch", "update"]
- apiGroups: ["k8s.cni.cncf.io"]
  resources: ["network-attachment-definitions"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
# The namespace default annotation (network.storm.io/default-networks).
- apiGroups: [""]
  resources: ["namespaces"]
  verbs: ["get", "list", "watch", "patch"]
# Status: the agents' node reports and the pods attached to each VLAN.
- apiGroups: [""]
  resources: ["nodes", "pods"]
  verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: network-operator-vlan
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: network-operator-vlan
subjects:
- kind: ServiceAccount
  name: network-operator-vlan
  namespace: kube-system
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: network-operator-vlan-agent
  namespace: kube-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: network-operator-vlan-agent
rules:
- apiGroups: ["network.storm.io"]
  resources: ["vlans"]
  verbs: ["get", "list", "watch"]
# Its report goes on its own node (network.storm.io/vlan-agent).
- apiGroups: [""]
  resources: ["nodes"]
  verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: network-operator-vlan-agent
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: network-operator-vlan-agent
subjects:
- kind: ServiceAccount
  name: network-operator-vlan-agent
  namespace: kube-system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: network-operator-vlan
  namespace: kube-system
  labels:
    app.kubernetes.io/name: network-operator-vlan
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: network-operator-vlan
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: network-operator-vlan
    spec:
      serviceAccountName: network-operator-vlan
      priorityClassName: system-cluster-critical
      containers:
      - name: controller
        image: localhost/network-operator:0.3.0
        imagePullPolicy: IfNotPresent
        args: ["run", "--controllers", "vlan"]
        env:
        - name: RUST_LOG
          value: info
        - name: HEALTH_ADDR
          value: 0.0.0.0:9446
        ports:
        - name: health
          containerPort: 9446
          protocol: TCP
        livenessProbe:
          httpGet:
            path: /healthz
            port: 9446
          initialDelaySeconds: 10
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /readyz
            port: 9446
          periodSeconds: 10
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
---
# The node agent: host network (it programs the host's bridge over netlink),
# NET_ADMIN and nothing else. It touches only `vlan_filtering` and the VLAN
# entries it added on BRIDGE's uplink ports (src/vlan/agent.rs).
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: network-operator-vlan-agent
  namespace: kube-system
  labels:
    app.kubernetes.io/name: network-operator-vlan-agent
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: network-operator-vlan-agent
  updateStrategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: network-operator-vlan-agent
    spec:
      serviceAccountName: network-operator-vlan-agent
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      priorityClassName: system-node-critical
      tolerations:
      - operator: Exists
      containers:
      - name: agent
        image: localhost/network-operator:0.3.0
        imagePullPolicy: IfNotPresent
        args: ["node-agent"]
        env:
        - name: RUST_LOG
          value: info
        - name: BRIDGE
          value: stormbr0
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        # A host port (host network): clear of the controller's 9446 and of
        # every port Cilium binds.
        - name: HEALTH_ADDR
          value: 0.0.0.0:9447
        livenessProbe:
          httpGet:
            path: /healthz
            port: 9447
          initialDelaySeconds: 10
          periodSeconds: 20
        resources:
          requests:
            cpu: 5m
            memory: 16Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
            add: ["NET_ADMIN"]
